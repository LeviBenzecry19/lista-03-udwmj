<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juros Compostos</title>
    <link rel="stylesheet" href="pratica03exercicio06.css">
</head>
<body>
    <main class="container">
        <h1>Juros Compostos</h1>
        <p class="formula">M = C × (1 + i)<sup>t</sup></p>
        <form id="formulario">
            <label for="capital">Capital inicial (R$):</label>
            <input type="number" id="capital" step="any" min="0" required>

            <label for="taxa">Taxa de juros (% por período):</label>
            <input type="number" id="taxa" step="any" required>

            <label for="tempo">Prazo (número de períodos):</label>
            <input type="number" id="tempo" step="any" min="0" required>
            <button type="submit">Calcular</button>
        </form>
        <p id="resultado"></p>
    </main>
    <script src="pratica03exercicio06.js"></script>
</body>
</html>
